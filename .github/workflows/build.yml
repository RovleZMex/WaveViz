name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist
      - name: Verify macOS signature
        if: runner.os == 'macOS'
        run: codesign --verify --deep --strict --verbose=2 dist/mac-arm64/WaveViz.app
      - uses: actions/upload-artifact@v4
        with:
          name: WaveViz-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
          if-no-files-found: error
